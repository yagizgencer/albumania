services:
  - type: web
    name: albumania-api
    runtime: python
    # Not `free`: free instances spin down after 15 min idle, and the next visitor
    # waits ~40 s for a cold boot while the whole SPA blocks on /auth/refresh.
    # Starter also unlocks preDeployCommand below, which free tier ignores.
    plan: starter
    rootDir: backend
    buildCommand: pip install uv && uv sync --no-dev
    # One worker on purpose. The instance has 0.5 CPU, so a second process would
    # double memory and add context-switching without adding throughput — the
    # workload is I/O-bound (Spotify, R2, Postgres), and the 40-thread anyio pool
    # already covers that. It also keeps the in-process Spotify cache coherent,
    # which a multi-worker setup would not.
    # --timeout-keep-alive 65 sits above typical proxy idle timeouts so
    # connections aren't torn down mid-keepalive.
    startCommand: uv run uvicorn app.main:app --host 0.0.0.0 --port $PORT --timeout-keep-alive 65
    preDeployCommand: uv run alembic upgrade head
    envVars:
      # Use Neon's POOLED endpoint (the host with `-pooler` in it). The direct
      # endpoint caps connections at the compute size and drops idle ones; the
      # pooler fronts them with pgbouncer. psycopg2 doesn't use server-side
      # prepared statements by default, so transaction pooling is safe here.
      - key: DATABASE_URL
        sync: false
      # Sized to anyio's 40-thread pool so a sync endpoint never waits on a
      # connection. See backend/app/db/session.py.
      - key: DB_POOL_SIZE
        value: "20"
      - key: DB_MAX_OVERFLOW
        value: "20"
      - key: JWT_SECRET
        generateValue: true
      # Cross-site cookie flow (Vercel frontend → Render API) needs SameSite=None
      # + Secure, which cookie_secure enables. Without this the refresh cookie is
      # SameSite=Lax and never sent on /auth/refresh, logging users out after the
      # access token expires (~15 min).
      - key: COOKIE_SECURE
        value: "true"
      - key: SPOTIFY_CLIENT_ID
        sync: false
      - key: SPOTIFY_CLIENT_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false
      # Transactional email (Resend). RESEND_API_KEY is a secret → set in dashboard.
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: Albumania <noreply@albumania.net>
      - key: FRONTEND_BASE_URL
        sync: false
      - key: STORAGE_BACKEND
        value: r2
      - key: API_BASE_URL
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_PUBLIC_URL_BASE
        sync: false
